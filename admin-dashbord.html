<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-800 text-slate-800">

  <div class="min-h-screen md:flex">

    <!-- Sidebar -->
    <section class="bg-slate-900 text-white p-6 md:w-64">
      <h1 class="text-2xl font-bold text-cyan-400 mb-8">
        DashPro
      </h1>
      <nav class="space-y-3">
        <a href="#" class="block bg-cyan-500 p-3 rounded-xl">
          Dashboard
        </a>
        <a href="#" class="block p-3 hover:bg-slate-800 rounded-xl">
          Analytics
        </a>
        <a href="#" class="block p-3 hover:bg-slate-800 rounded-xl">
          Customers
        </a>
        <a href="#" class="block p-3 hover:bg-slate-800 rounded-xl">
          Settings
        </a>
      </nav>
    </section>

    <!-- Main content -->
    <main class="flex-1 p-6 md:p-10">
      <header class="flex flex-wrap justify-between gap-4 mb-8">
        <div class="flex">
          <h2 class="text-2xl  text-white me-2">Dashboard</h2>
          <h2 class="text-2xl  text-white ms-2">Overview</h2>
        </div>
        <button class="bg-indigo-600 text-white px-5 py-3 rounded-xl
                       hover:bg-indigo-700">
          + Add Report
        </button>
      </header>

      <!-- Stats -->
      <section class="flex justify-around">
      
        
      <div class="flex w-[700px] h-[350px] bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-200">
        <div>
          <h2 class="text-white text-3xl m-1 font-bold">Growth Insight</h2>
          <p class="text-white m-1 mt-5">
            Your key metrics show consistent <br/>growth across the channels. <br/>Dive dipper to identify top-<br/>performing segments.
          </p>
          <button class="bg-orange-500 text-white px-5 py-2 rounded-lg hover:bg-cyan-600 m-3">
            View insights
          </button>
          </div>
          <div>
            <img src="https://img.magnific.com/premium-photo/business-growth-financial-success-visualization_745328-893.jpg?semt=ais_hybrid&w=740&q=80" class="border border-slate-200 rounded-xl h-[250px] w-[400px] m-3"/>
          </div>
        </div>
        
        <div class="bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-200 h-[350px] w-[350px] ">
          <p class="text-white text-2xl">Total Revenue</p>
          <h3 class="text-3xl font-bold mt-3 text-white">$1,25.000</h3>
          <p class="text-emerald-600 mt-2">↑ 12.5% this month</p>
          <img src="https://cdn1.byjus.com/wp-content/uploads/2021/03/line-graph.png" class="border border-slate-200 rounded-xl h-[150px] w-[150px]" m-3/>
        </div>

        <div class="bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-200 h-[350px] w-[350px] ">
          <p class="text-white text-2xl">Total Visitor</p>
          <h3 class="text-3xl font-bold mt-3 text-white">25,300</h3>
          <p class="text-emerald-600 mt-2">↑ 8.2% this month</p>
          <img src="https://www.shutterstock.com/image-vector/financial-growth-bar-chart-glowing-260nw-2762697257.jpg" class="border border-slate-200 rounded-xl h-[150px] w-[150px]" m-3/>
        </div>
      </section>
    <div class="flex justify-around">
       <div class="bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-200  h-[500px] w-[710px] border mt-4 ">
    
       </div>
       <div class="bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-200 h-[500px] w-[750px] border mt-4 ">
    
       </div>
    </div>
   
    </main>
  </div>

</body>
</html>
