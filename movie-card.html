<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie-card</title>
</head>

<body>
    <div class="bg-gray-800 w-[330px] p-2 m-4 rounded-md relative">
        <img src="poster-1.png" class="w-[300px] h-[450px]  mx-auto object-cover"/>

        <span class="text-white font-bold text-2xl m-4">Welcome To the Jungle</span>
        <p>
            <span class="text-gray-400 text-xl m-4">2026</span>
            <span class="text-gray-400">|</span>
            <span class="text-gray-400 text-xl ">Thriller</span>   
        </p>
        <p class="text-green-700 ms-4">
            Most watched movie.
        </p>

        <div class="flex justify-around py-2">
            <button class="bg-red-500 text-md w-[80px] h-[30px] text-white rounded">play</button>
            <button class="bg-slate-600 text-md w-[80px] h-[30px] text-white rounded">My List</button>
        </div>
        <img src="bookmark.png" class="absolute top-3 right-3 w-6 h-6"/>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</body>

</html>
